<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3efe4" />
  <title>Scrap Dash — Build it. Beat them to it.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Scrap Dash home"><span class="brand-mark">✳</span><span>SCRAP<span class="brand-dash">/</span>DASH</span></a>
      <nav class="top-nav"><a href="#how">How to play</a><a href="#about">About</a></nav>
      <button class="profile" aria-label="Player profile"><span class="profile-avatar">J</span><span>Junkyard Jess</span><span class="chevron">⌄</span></button>
    </header>

    <main>
      <section class="hero" id="about">
        <div class="hero-copy">
          <div class="eyebrow"><span class="live-dot"></span> THE JUNKYARD IS OPEN</div>
          <h1>Build it.<br /><span>Beat them</span> to it.</h1>
          <p class="hero-lede">Three parts. One machine. A whole yard full of rivals.<br />Ready, set, scavenge.</p>
          <div class="hero-actions"><button class="button button-dark" id="quickPlay">Quick play <span>↗</span></button><button class="button button-light" id="openJoin">Join a room <span>→</span></button></div>
          <div class="player-note"><div class="avatar-stack"><i class="av av-coral">M</i><i class="av av-blue">K</i><i class="av av-green">R</i><i class="av av-yellow">+</i></div><span><b>2–8 players</b> · Free to play</span></div>
        </div>
        <div class="hero-art" aria-label="A colorful illustration of a machine built from junkyard parts">
          <div class="sunburst"></div><div class="art-tag tag-top">YARD 04 <span>✳</span></div>
          <div class="machine-shadow"></div>
          <div class="machine">
            <div class="antenna"><span></span></div><div class="machine-top"><i class="top-bolt"></i><i class="top-bolt"></i></div>
            <div class="machine-body"><div class="face"><span class="eye eye-left"></span><span class="eye eye-right"></span><span class="mouth"></span></div><div class="body-plate"></div></div>
            <div class="machine-neck"></div><div class="machine-base"><span class="vent"></span><span class="vent"></span><span class="vent"></span><span class="vent"></span></div>
            <div class="wheel wheel-left"><i></i></div><div class="wheel wheel-right"><i></i></div><div class="machine-arm arm-left">⌁</div><div class="machine-arm arm-right">⌁</div>
